modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "${mod_url}"
    authors="${mod_author}"
    description = '''
Phoenix Wiki - a small, self-contained data-driven in-game wiki/markdown engine, meant to be
jar-in-jar'd into other mods. Not a standalone content mod on its own; other mods call
PhoenixWikiAPI to open a wiki backed by their own assets/<namespace>/wiki/<locale>/*.md pages.
'''

    [[dependencies.${mod_id}]]
        modId = "forge"
        mandatory = true
        versionRange = "[${forge_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version},)"
        ordering = "NONE"
        side = "BOTH"
