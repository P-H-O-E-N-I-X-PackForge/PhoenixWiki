description = '''
Phoenix Wiki - a small, self-contained data-driven in-game wiki/markdown engine, meant to be
jar-in-jar'd into other mods. Not a standalone content mod on its own; other mods call
PhoenixWikiAPI to open a wiki backed by their own assets/<namespace>/wiki/<locale>/*.md pages.
'''

